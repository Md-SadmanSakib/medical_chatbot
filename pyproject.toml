[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "medical_chatbot"
version = "0.0.1"
description = "A A medical chatbot designed to provide guidance and information to users on various health-related topics. This AI-powered assistant aims to offer preliminary medical advice, help users understand symptoms, and direct them to appropriate healthcare resources when necessary. It serves as a first point of contact for health queries, enhancing accessibility to medical information while emphasizing the importance of professional medical consultation for accurate diagnosis and treatment."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["medical_chatbot"]
force_sort_within_sections = true
